<style>
  :root { --fondo:#F4F3EF; --blanco:#FFFFFF; --negro:#1A1A1A; --acero:#6B7280; --borde:#E5E2DA; --verde:#2D7D46; --amarillo:#F5A623; --rojo:#B91C1C; --azul:#2563EB; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --fondo:#141414; --blanco:#1F1F1F; --negro:#F3F4F6; --acero:#9CA3AF; --borde:#33332F; } header { background:#000 !important; color:#fff !important; } thead tr { background:#2A2A2A !important; color:#fff !important; } .btn-secondary { background:#2E2E2E !important; color:#F3F4F6 !important; } select, input, textarea { background:#262626 !important; color:#F3F4F6 !important; } }

<div id="acceso">

</div>
<header><h1>⚡ Energía eléctrica</h1><span id="quien"></span><a href="/" style="color:#F5A623;font-size:13px">← Volver a la app</a></header>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const app = initializeApp({ apiKey: "AIzaSyAVsios3N97MQVPJLC94qEOXGJNmKzK9RI", authDomain: "combustible-los-maitenes.firebaseapp.com", projectId: "combustible-los-maitenes", storageBucket: "combustible-los-maitenes.firebasestorage.app", messagingSenderId: "750216939749", appId: "1:750216939749:web:978e4173eaee8235ebac0c" });
const db = getFirestore(app);

// ── utilidades ──────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const escA = t => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const normNom = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function toast(m, ok = true) { const t = $('toast'); t.textContent = m; t.className = ok ? '' : 'mal'; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 4000); }
const pesos = v => v == null || !isFinite(v) ? '–' : (v < 0 ? '-$' : '$') + Math.abs(Math.round(v)).toLocaleString('es-CL');
const num = (v, d = 0) => v == null || !isFinite(v) ? '–' : Number(v).toLocaleString('es-CL', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = v => v == null || !isFinite(v) ? '–' : (v > 0 ? '+' : '') + num(v, 1) + ' %';
const parseNum = v => { if (v == null) return null; let s = String(v).replace(/[$\s]/g, ''); if (!s || !/\d/.test(s)) return null; if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.'); else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); else s = s.replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? n : null; };
const hoyStr = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const ms = f => f ? new Date(f + 'T12:00:00').getTime() : null;
const dias = (a, b) => (ms(b) - ms(a)) / 86400000;
const fCorta = f => f ? f.slice(8, 10) + '-' + f.slice(5, 7) + '-' + f.slice(2, 4) : '–';
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const mesTxt = m => m ? MESES[parseInt(m.slice(5, 7), 10) - 1] + ' ' + m.slice(2, 4) : '–';
const mesDe = f => f ? f.slice(0, 7) : '';
const mesMas = (m, n) => { let y = +m.slice(0, 4), k = +m.slice(5, 7) - 1 + n; y += Math.floor(k / 12); k = ((k % 12) + 12) % 12; return y + '-' + String(k + 1).padStart(2, '0'); };

// ── acceso ──────────────────────────────────────────────────────────────
const ADMINS_EQUIVALENTES = ['Camila Faundez', 'JC Allende'];
let USER = null, permisosPruebas = {};
const puedeVer = (n, admin) => admin || ADMINS_EQUIVALENTES.includes(n) || (Array.isArray(permisosPruebas[n]) && permisosPruebas[n].includes('energia'));
async function cargarPermisos() { try { const sn = await getDoc(doc(db, 'config', 'datos')); if (sn.exists()) permisosPruebas = sn.data().permisosPruebas || {}; } catch (e) {} }
window.entrarEnergia = async function () {
  const pin = $('acc-pin').value.trim(), msg = $('acc-msg'); if (!pin) { msg.textContent = 'Ingresa tu PIN.'; return; }
  let nombre = null;
  try { const sp = await getDoc(doc(db, 'config', 'pines')); const op = sp.exists() ? Object.entries(sp.data()).find(([, p]) => p === pin) : null; if (op) nombre = op[0]; }
  catch (e) { msg.textContent = 'No se pudo verificar: ' + e.message; return; }
  if (!nombre) { msg.textContent = 'PIN incorrecto. Si eres el administrador, entra desde el menú de la app.'; $('acc-pin').value = ''; return; }
  await cargarPermisos();
  if (!puedeVer(nombre, false)) { msg.textContent = 'No tienes acceso a Energía eléctrica.'; return; }
  USER = { nombre, admin: false, pin }; try { sessionStorage.setItem('energia_usuario', JSON.stringify({ nombre, admin: false })); } catch (e) {}
  $('acceso').style.display = 'none'; iniciar();
};
async function revisarAcceso() {
  await cargarPermisos();
  let u = null;
  try {
    let pase = JSON.parse(localStorage.getItem('maitenes_pase') || 'null');
    const hm = /[#&]pase=([^&]+)/.exec(location.hash || '');
    if (hm) { try { pase = JSON.parse(decodeURIComponent(hm[1])); } catch (e) {} try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    if (pase && pase.nombre && Date.now() - pase.ts < 10 * 60000) { u = { nombre: pase.nombre, admin: !!pase.admin }; localStorage.removeItem('maitenes_pase'); sessionStorage.setItem('energia_usuario', JSON.stringify(u)); }
    else u = JSON.parse(sessionStorage.getItem('energia_usuario') || 'null');
  } catch (e) {}
  if (u && puedeVer(u.nombre, u.admin)) { USER = u; iniciar(); return; }
  $('acceso').style.display = 'flex';
}

// ── datos ───────────────────────────────────────────────────────────────
const S = { potreros: [], ha: {}, sum: [], lec: [], fac: [], tab: 'resumen', form: null, filtroSum: '', cmp: { sum: '', met: 'kwh' } };
async function cargarTodo() {
  const leer = async n => (await getDocs(collection(db, n))).docs.map(d => ({ id: d.id, ...d.data() }));
  [S.sum, S.lec, S.fac] = await Promise.all([leer('energia_suministros'), leer('energia_lecturas'), leer('energia_facturas')]);
  S.sum.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es'));
  try { const sn = await getDoc(doc(db, 'config', 'datos')); S.potreros = ((sn.exists() && sn.data().potreros) || []).map(p => ({ nombre: p.nombre, ha: p.hectareas != null && p.hectareas !== '' ? Number(p.hectareas) : null, tipo: p.tipo || '', cultivo: p.cultivoPermanente || '' })).filter(p => p.nombre).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')); } catch (e) { S.potreros = []; }
}
const hijos = id => S.sum.filter(x => x.principal === id && x.activo !== false);
const hijosTodos = id => S.sum.filter(x => x.principal === id);
const sumDe = id => S.sum.find(s => s.id === id);
const facDe = id => S.fac.filter(f => f.suministro === id).sort((a, b) => (a.periodoHasta || a.mes || '').localeCompare(b.periodoHasta || b.mes || ''));
const lecDe = id => S.lec.filter(l => l.suministro === id).sort((a, b) => a.fecha.localeCompare(b.fecha) || (a.ts || 0) - (b.ts || 0));
const esSaldo = c => /impago|saldo anterior|meses anteriores|^\s*(sub)?total/i.test(c.concepto || '');
const cargosMes = f => (f.cargos || []).filter(c => !esSaldo(c));
const mora = f => f.interesMora || 0;
const netoSM = f => { const b = f.neto || (f.total ? f.total / 1.19 : null); return b == null ? null : b - mora(f); };
const totalSM = f => f.total == null ? null : f.total - mora(f) * (f.neto && f.iva != null ? 1 + f.iva / f.neto : 1.19);
// Precio de la energía: línea «Electricidad consumida» ÷ kWh (no mezcla demanda, factor de potencia ni mora)
const precioKwh = f => { const l = cargosMes(f).find(c => /electricidad consumida|energ[ií]a consumida/i.test(c.concepto || '')); if (l && l.monto && f.consumoKwh > 0) return l.monto / f.consumoKwh; const b = netoSM(f); return b && f.consumoKwh > 0 ? b / f.consumoKwh : null; };
// Costo total por kWh: todo el neto del mes (energía + demanda + transporte + factor de potencia), sin mora
// Desglose por tipo de cargo (sin saldo anterior ni subtotales)
const CATS = [['energia', 'Energía consumida', /electricidad consumida|energ[ií]a consumida/i], ['transporte', 'Transporte de electricidad', /transporte/i], ['admin', 'Administración del servicio', /administraci/i], ['punta', 'Demanda en horas punta', /punta/i], ['demanda', 'Demanda suministrada (potencia)', /demanda/i], ['fp', 'Factor de potencia', /factor de potencia/i], ['mora', 'Interés por mora', /mora/i], ['noafecto', 'Servicio público y fondo de estabilización', /servicio p[uú]blico|estabilizaci/i]];
function desglose(f) {
  const tot = {}; CATS.forEach(c => tot[c[0]] = 0); tot.otros = 0;
  cargosMes(f).forEach(c => { const k = (CATS.find(x => x[2].test(c.concepto || '')) || ['otros'])[0]; tot[k] += c.monto || 0; });
  if (!tot.mora && f.interesMora) tot.mora = f.interesMora;
  return tot;
}
const kwhDe = (f, v) => f.consumoKwh > 0 && v != null ? v / f.consumoKwh : null;
const sinPotPunta = f => { const d = desglose(f), b = netoSM(f); return b == null ? null : b - d.demanda - d.punta; };
const costoKwhSinPotPunta = f => kwhDe(f, sinPotPunta(f));
const costoKwh = f => { const b = netoSM(f); return b && f.consumoKwh > 0 ? b / f.consumoKwh : null; };

// Consumo según NUESTRAS lecturas entre dos fechas (interpolación lineal entre lecturas; tolera 4 días fuera del rango)
function valorEn(lecs, t) {
  if (!lecs.length) return null;
  const T = ms(t), first = lecs[0], last = lecs[lecs.length - 1];
  if (T < ms(first.fecha)) return dias(t, first.fecha) <= 4 ? { v: first.lectura, aprox: true } : null;
  if (T > ms(last.fecha)) return dias(last.fecha, t) <= 4 ? { v: last.lectura, aprox: true } : null;
  for (let i = 0; i < lecs.length; i++) {
    const a = lecs[i], b = lecs[i + 1];
    if (ms(a.fecha) === T) return { v: a.lectura, aprox: false };
    if (b && ms(a.fecha) < T && T <= ms(b.fecha)) { if (ms(b.fecha) === T) return { v: b.lectura, aprox: false }; if (b.reinicio) return null; const k = (T - ms(a.fecha)) / (ms(b.fecha) - ms(a.fecha)); return { v: a.lectura + (b.lectura - a.lectura) * k, aprox: ms(b.fecha) !== T && ms(a.fecha) !== T }; }
  }
  return null;
}
function consumoPropio(sumId, d0, d1) {
  const lecs = lecDe(sumId), s = sumDe(sumId), K = (s && s.constante) || 1;
  if (!d0 || !d1 || lecs.length < 2) return null;
  const a = valorEn(lecs, d0), b = valorEn(lecs, d1); if (!a || !b) return null;
  return { kwh: (b.v - a.v) * K, aprox: a.aprox || b.aprox };
}

// ── revisión automática de una factura ───────────────────────────────────
function revisarFactura(f, excluirId) {
  const out = [], add = (nivel, txt) => out.push({ nivel, txt });
  const s = sumDe(f.suministro);
  if (!s) add('err', 'Falta asignar la factura a un suministro.');
  const hasta = f.periodoHasta || '', desde = f.periodoDesde || '';
  const otras = facDe(f.suministro).filter(x => x.id !== excluirId);
  const previas = hasta ? otras.filter(x => (x.periodoHasta || '') < hasta) : otras; // solo meses anteriores: así da igual el orden en que se suban
  if (s && hasta && otras.some(x => x.periodoHasta === hasta || (x.mes && x.mes === mesDe(hasta)))) add('err', 'Ya existe una factura de este suministro para el mismo período (posible duplicado).');
  if (desde && hasta) { const d = dias(desde, hasta); if (d <= 0) add('err', 'El período termina antes de empezar.'); else if (d < 25 || d > 36) add('warn', `El período dura ${num(d)} días (lo normal es 28–33).`); else add('ok', `Período de ${num(d)} días.`); }
  else add('info', 'Faltan las fechas del período.');
  const K = f.constante || (s && s.constante) || 1;
  if (f.lecturaAnterior != null && f.lecturaActual != null && f.consumoKwh != null) {
    const calc = (f.lecturaActual - f.lecturaAnterior) * K, dif = f.consumoKwh - calc;
    if (Math.abs(dif) <= Math.max(1, calc * 0.01)) add('ok', `Lecturas × constante (${num(K, K % 1 ? 2 : 0)}) = ${num(calc)} kWh, coincide con el consumo facturado.`);
    else add('err', `Las lecturas dan ${num(calc)} kWh (${num(f.lecturaActual)} − ${num(f.lecturaAnterior)}, × ${num(K, K % 1 ? 2 : 0)}), pero se facturaron ${num(f.consumoKwh)} kWh (diferencia ${num(dif)}).`);
  } else add('info', 'Sin lecturas o consumo para cuadrar kWh.');
  const prev = previas.filter(x => (x.periodoHasta || '') < hasta).slice(-1)[0];
  if (prev && prev.lecturaActual != null && f.lecturaAnterior != null) {
    if (Math.abs(prev.lecturaActual - f.lecturaAnterior) > 1) add('warn', `La lectura anterior (${num(f.lecturaAnterior)}) no empalma con la actual de la factura previa (${num(prev.lecturaActual)}). Revisa si hubo cambio de medidor o una lectura estimada.`);
    else add('ok', 'La lectura anterior empalma con la factura previa.');
  }
  if (cargosMes(f).length && f.neto) {
    const sc = cargosMes(f).reduce((a, c) => a + (c.monto || 0), 0), na = f.noAfectos || 0, tol = Math.max(5, f.neto * 0.01);
    if ([f.neto, f.neto + na, f.total || 0, (f.total || 0) - (f.iva || 0)].some(v => Math.abs(sc - v) <= tol)) add('ok', 'Los cargos listados suman lo que indica la factura.');
    else add('warn', `Los cargos listados suman ${pesos(sc)} y no calzan con neto ${pesos(f.neto)}, neto + no afectos ${pesos(f.neto + na)} ni total ${pesos(f.total)}. Puede faltar una línea o haber una de más.`);
  }
  if (f.neto != null && f.iva != null && f.total != null) { const esp = f.neto + f.iva + (f.noAfectos || 0); if (Math.abs(esp - f.total) > 5) add('err', `Neto + IVA + cobros no afectos (${pesos(esp)}) no coincide con el total de factura (${pesos(f.total)}).`); else add('ok', 'Neto + IVA + cobros no afectos = total de factura.'); }
  if (f.total != null && f.totalAPagar != null) { const esp = f.total + (f.saldoAnterior || 0); if (Math.abs(esp - f.totalAPagar) > 5) add('err', `Total de factura + saldo anterior (${pesos(esp)}) no coincide con el total a pagar (${pesos(f.totalAPagar)}).`); }
  if (f.saldoAnterior > 0) add('warn', `Arrastra un saldo anterior impago de ${pesos(f.saldoAnterior)}. No se incluye en los cálculos ni comparaciones: el costo del mes es ${pesos(f.total)}, pero el total a pagar es ${pesos(f.totalAPagar)}.`);
  if (f.interesMora > 0) add('warn', `Cobró ${pesos(f.interesMora)} de interés por mora (por deuda anterior). No se incluye en el costo por kWh ni en las comparaciones.`);
  if (f.corteTramite) add('err', 'La cuenta dice «Corte en trámite»' + (f.fechaCorte ? ' (corte desde ' + fCorta(f.fechaCorte) + ')' : '') + '.');
  else if (f.fechaCorte) add('warn', 'Fecha de corte: ' + fCorta(f.fechaCorte) + '.');
  if (f.kvarhActual != null && f.kvarhAnterior != null && f.consumoKwh > 0) {
    const kv = f.consumoKvarh != null ? f.consumoKvarh : (f.kvarhActual - f.kvarhAnterior) * K;

    f._fp = fp;

// ── gráficos (SVG simple) ───────────────────────────────────────────────
function barras(labels, series, fmt, alto = 170) {
  const W = 640, H = alto, pl = 8, pb = 22, pt = 14, n = labels.length, g = (W - pl * 2) / Math.max(1, n), k = series.length, bw = Math.min(26, (g - 6) / k);
  const max = Math.max(1, ...series.flatMap(s => s.valores.map(v => v || 0)));
  let b = '';
  labels.forEach((l, i) => {
    series.forEach((s, j) => { const v = s.valores[i]; if (v == null) return; const h = (H - pb - pt) * v / max, x = pl + g * i + (g - bw * k) / 2 + bw * j; b += `<rect x="${x.toFixed(1)}" y="${(H - pb - h).toFixed(1)}" width="${(bw - 1).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${s.color}"><title>${escA(l)} · ${escA(s.nombre)}: ${escA(fmt(v))}</title></rect>`; if (k === 1 && n <= 14) b += `<text x="${(pl + g * i + g / 2).toFixed(1)}" y="${(H - pb - h - 3).toFixed(1)}" font-size="9" text-anchor="middle" fill="currentColor">${escA(fmt(v))}</text>`; });
    b += `<text x="${(pl + g * i + g / 2).toFixed(1)}" y="${H - 6}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".7">${escA(l)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:var(--negro)" role="img">${b}<line x1="${pl}" x2="${W - pl}" y1="${H - pb}" y2="${H - pb}" stroke="currentColor" opacity=".25"/></svg>`;
}

}

// ── 🔌 Submedidores ──────────────────────────────────────────────────────

// ── 🔢 Lecturas propias ──────────────────────────────────────────────────

    <label style="font-size:13px;display:flex;gap:6px;align-items:center;margin:6px 0"><input type="checkbox" id="l-reinicio" style="width:auto"> El medidor se reinició o fue reemplazado</label>

  if (ant && !reinicio && val < ant.lectura && !confirm(`La lectura (${num(val, 1)}) es menor que la anterior (${num(ant.lectura, 1)} el ${fCorta(ant.fecha)}). ¿Guardar igual?`)) return;
  if (ant && !reinicio && ant.fecha < fecha) { const d = dias(ant.fecha, fecha), s = sumDe(sid), prom = lecs.length > 2 ? (lecs[lecs.length - 1].lectura - lecs[0].lectura) / Math.max(1, dias(lecs[0].fecha, lecs[lecs.length - 1].fecha)) : null; if (prom && d > 0 && (val - ant.lectura) / d > prom * 3 && !confirm('El consumo por día de esta lectura es más de 3 veces el habitual. ¿Está bien la lectura?')) return; }
  try { await addDoc(collection(db, 'energia_lecturas'), { suministro: sid, fecha, lectura: val, obs: $('l-obs').value.trim(), reinicio, registrado_por: USER.nombre, ts: Date.now() }); await cargarTodo(); render(); toast('✓ Lectura guardada'); } catch (e) { toast('Error: ' + e.message, false); }
};
window.borrarLectura = async function (id) { if (!confirm('¿Borrar esta lectura?')) return; try { await deleteDoc(doc(db, 'energia_lecturas', id)); await cargarTodo(); render(); } catch (e) { toast('Error: ' + e.message, false); } };

// ── 📈 Comparar ──────────────────────────────────────────────────────────
window.S_cmp = (k, v) => { S.cmp[k] = v; render(); };
function rComparar() {
  if (!S.fac.length) return '<div class="panel">Sube facturas para poder comparar.</div>';
  const sid = S.cmp.sum, met = S.cmp.met;
  const base = sid ? S.fac.filter(f => f.suministro === sid) : S.fac;
  const valor = f => met === 'kwh' ? f.consumoKwh : met === 'total' ? totalSM(f) : met === 'costo' ? costoKwh(f) : met === 'costosp' ? costoKwhSinPotPunta(f) : met === 'demanda' ? (() => { const d = desglose(f); return d.demanda + d.punta; })() : precioKwh(f);
  const fmt = v => met === 'kwh' ? num(v) : (met === 'total' || met === 'demanda') ? pesos(v) : '$' + num(v, met === 'costo' ? 0 : 1);
  const agg = (mes) => { const fs = base.filter(f => f.mes === mes); if (!fs.length) return null; if (met === 'precio' || met === 'costo' || met === 'costosp') { const k = fs.reduce((a, f) => a + (f.consumoKwh || 0), 0), n = fs.reduce((a, f) => a + (met === 'costo' ? (netoSM(f) || 0) : met === 'costosp' ? (sinPotPunta(f) || 0) : (precioKwh(f) || 0) * (f.consumoKwh || 0)), 0); return k > 0 ? n / k : null; } return fs.reduce((a, f) => a + (valor(f) || 0), 0); };
  const ult = base.map(f => f.mes).filter(Boolean).sort().slice(-1)[0], y = ult ? +ult.slice(0, 4) : new Date().getFullYear();
  const lab = MESES.map(m => m), v1 = MESES.map((_, i) => agg(`${y}-${String(i + 1).padStart(2, '0')}`)), v0 = MESES.map((_, i) => agg(`${y - 1}-${String(i + 1).padStart(2, '0')}`));
  const series = [{ nombre: String(y - 1), color: '#9CA3AF', valores: v0 }, { nombre: String(y), color: '#2D7D46', valores: v1 }];
  const t1 = v1.filter(x => x != null).reduce((a, b) => a + b, 0), idx = v1.map((x, i) => x != null && v0[i] != null ? i : -1).filter(i => i >= 0);
  const sumA = idx.reduce((a, i) => a + v1[i], 0), sumB = idx.reduce((a, i) => a + v0[i], 0);
  const resumen = idx.length ? `En los ${idx.length} meses con datos en ambos años: <b>${fmt(sumA)}</b> (${y}) vs <b>${fmt(sumB)}</b> (${y - 1}) → <b class="${sumA > sumB ? 'up' : 'down'}">${pct((sumA / sumB - 1) * 100)}</b>` : 'Aún no hay meses con datos en ambos años.';
  const ult12 = [...new Set(base.map(f => f.mes).filter(Boolean))].sort().slice(-13);
  const cont = `<div class="panel"><h2>Comparar</h2><div class="grid"><div class="field"><label>Suministro</label><select onchange="S_cmp('sum',this.value)"><option value="">Todos juntos</option>${S.sum.map(s => `<option value="${s.id}" ${s.id === sid ? 'selected' : ''}>${escA(s.nombre)}</option>`).join('')}</select></div><div class="field"><label>Qué comparar</label><select onchange="S_cmp('met',this.value)"><option value="kwh" ${met === 'kwh' ? 'selected' : ''}>Consumo (kWh)</option><option value="total" ${met === 'total' ? 'selected' : ''}>Costo del mes, sin mora ($)</option><option value="precio" ${met === 'precio' ? 'selected' : ''}>Precio de la energía ($/kWh)</option><option value="costo" ${met === 'costo' ? 'selected' : ''}>Costo total por kWh, sin mora</option><option value="costosp" ${met === 'costosp' ? 'selected' : ''}>Costo por kWh sin potencia ni punta</option><option value="demanda" ${met === 'demanda' ? 'selected' : ''}>Cargos de potencia + punta ($)</option></select></div></div>
    <h2 style="margin-top:10px">Mismo mes, año contra año</h2>${leyenda(series)}${barras(lab, series, fmt, 190)}<div style="font-size:13px;margin-top:6px">${resumen}</div></div>
    <div class="panel"><h2>Mes contra mes (últimos 13)</h2>${barras(ult12.map(mesTxt), [{ nombre: 'Valor', color: '#F5A623', valores: ult12.map(agg) }], fmt, 170)}
    <div class="tw" style="margin-top:6px"><table><thead><tr><th>Mes</th><th class="n">Valor</th><th class="n">vs mes anterior</th><th class="n">vs mismo mes año anterior</th></tr></thead><tbody>${[...ult12].reverse().map(m => { const a = agg(m), p = agg(mesMas(m, -1)), q = agg(mesMas(m, -12)); return `<tr><td>${mesTxt(m)}</td><td class="n">${fmt(a)}</td><td class="n">${a != null && p ? pct((a / p - 1) * 100) : '–'}</td><td class="n">${a != null && q ? pct((a / q - 1) * 100) : '–'}</td></tr>`; }).join('')}</tbody></table></div></div>`;
  return cont;
}

// ── ⚙️ Suministros ───────────────────────────────────────────────────────
let editSum = null;
function rSuministros() {
  const f = editSum;
  const form = f ? `<div class="panel"><h2>${f.id ? 'Editar' : 'Nuevo'} suministro</h2>
    <div class="grid"><div class="field"><label>Nombre</label><input id="s-nombre" value="${escA(f.nombre || '')}" placeholder="Ej: Bomba pozo 1"></div><div class="field"><label>N° de cliente (Copelec)</label><input id="s-cli" value="${escA(f.nCliente || '')}"></div><div class="field"><label>N° de medidor</label><input id="s-med" value="${escA(f.medidor || '')}"></div><div class="field"><label>Tarifa</label><input id="s-tar" value="${escA(f.tarifa || '')}" placeholder="BT1, AT3…"></div><div class="field"><label>Constante del medidor</label><input id="s-const" type="number" step="any" value="${f.constante || 1}"></div><div class="field"><label>Es submedidor de</label><select id="s-ppal"><option value="">— cuenta propia de Copelec —</option>${S.sum.filter(x => x.id !== f.id && !x.principal).map(x => `<option value="${x.id}" ${f.principal === x.id ? 'selected' : ''}>${escA(x.nombre)}</option>`).join('')}</select></div><div class="field"><label>Conexión</label><select id="s-fase"><option value="">Sin definir</option><option value="mono" ${f.fase === 'mono' ? 'selected' : ''}>Monofásico</option><option value="tri" ${f.fase === 'tri' ? 'selected' : ''}>Trifásico</option></select></div><div class="field"><label>Uso / centro de costo</label><input id="s-centro" value="${escA(f.centro || '')}" placeholder="Riego, casa, bodega…"></div></div>
    <div class="field"><label>Potreros que riega (para el costo por ha)</label>${S.potreros.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px;max-height:220px;overflow:auto;border:1px solid var(--borde);border-radius:8px;padding:8px">${S.potreros.map((q, i) => `<label style="font-size:13px;display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-weight:400;margin:0"><input type="checkbox" class="s-pot" data-i="${i}" style="width:auto" ${(f.potreros || []).includes(q.nombre) ? 'checked' : ''}> ${escA(q.nombre)}${q.ha ? ' <span class="hint">' + num(q.ha, 1) + ' ha</span>' : ' <span class="hint" style="color:#B45309">sin ha</span>'}</label>`).join('')}</div>` : '<div class="hint">No se pudieron leer los potreros de la app.</div>'}</div>
    <div class="field"><label>Dirección / notas</label><input id="s-dir" value="${escA(f.direccion || '')}"></div>
    <label style="font-size:13px;display:flex;gap:6px;align-items:center;margin:6px 0"><input type="checkbox" id="s-act" style="width:auto" ${f.activo !== false ? 'checked' : ''}> Suministro activo</label>
    <div style="display:flex;gap:8px"><button class="btn btn-secondary" style="flex:1;justify-content:center" onclick="editSumCancel()">Cancelar</button><button class="btn btn-verde" style="flex:1;justify-content:center" onclick="guardarSuministro()">💾 Guardar</button></div></div>` : `<button class="btn btn-verde" style="margin-bottom:10px" onclick="editSumNuevo()">＋ Nuevo suministro</button>`;
  const lista = `<div class="panel"><h2>Suministros</h2>${S.sum.length ? `<div class="tw"><table><thead><tr><th>Nombre</th><th>Cliente</th><th>Medidor</th><th>Tarifa</th><th>Fase</th><th class="n">Const.</th><th>Uso</th><th></th></tr></thead><tbody>${S.sum.map(s => `<tr><td>${s.principal ? '↳ ' : ''}${escA(s.nombre)}${s.principal ? `<div class="hint">submedidor de ${escA((sumDe(s.principal) || {}).nombre || '?')}</div>` : (hijos(s.id).length ? `<div class="hint">cuenta principal de ${hijos(s.id).length} medidores</div>` : '')}${s.activo === false ? ' <span class="chip warn">inactivo</span>' : ''}</td><td>${escA(s.nCliente || '–')}</td><td>${escA(s.medidor || '–')}</td><td>${escA(s.tarifa || '–')}</td><td>${s.fase === 'mono' ? 'Mono' : s.fase === 'tri' ? 'Tri' : '–'}</td><td class="n">${num(s.constante || 1, 2)}</td><td>${escA(s.centro || '–')}${(s.potreros || []).length ? `<div class="hint">${escA(s.potreros.join(', '))} · ${num(haSum(s), 1)} ha</div>` : ''}</td><td style="white-space:nowrap"><button class="btn btn-secondary" onclick="editSumEditar('${s.id}')">✏️</button> <button class="btn btn-rojo" onclick="borrarSuministro('${s.id}')">✕</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="hint">Aún no hay suministros.</div>'}</div>`;
  const reglas = `<div class="panel"><h2>📏 Qué considera correcto la app</h2>
    <details><summary style="cursor:pointer;font-weight:600">Trifásico (bombas, pozos, bodegas, packing)</summary><ul style="font-size:13px;line-height:1.6;margin:8px 0 0 16px;padding:0">
      <li><b>Factor de potencia ≥ 0,93.</b> Bajo eso hay recargo; bajo 0,80 es error.</li>
      <li><b>Relación reactiva/activa ≤ 0,43</b> (kVArh ÷ kWh): equivale a FP 0,93.</li>
      <li><b>Lecturas × constante = kWh facturados</b> (tolerancia 1 %).</li>
      <li><b>Demanda leída ≤ potencia conectada.</b> Si la supera, puede haber recargo.</li>
      <li><b>Demanda suministrada vs leída:</b> si se paga el doble o más de lo que se usa, aviso.</li>
      <li><b>Factor de carga</b> (kWh ÷ demanda × horas): bajo 10 % es aviso informativo.</li>
      <li><b>Demanda en punta</b> (abril a septiembre, 18–23 h): se señala porque es la más cara.</li>
      <li>Se estima la <b>corriente por fase</b> a 380 V para saber si el empalme está holgado.</li>
      <li>Consumo y precio por kWh contra el promedio de meses anteriores y contra el mismo mes del año pasado.</li></ul></details>
    <details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600">Monofásico (casas, oficinas, galpones chicos)</summary><ul style="font-size:13px;line-height:1.6;margin:8px 0 0 16px;padding:0">
      <li><b>Potencia conectada hasta ~10 kW.</b> Sobre eso se avisa que quizás es trifásico.</li>
      <li><b>No debería tener cargos de demanda ni de factor de potencia</b> (tarifa BT1).</li>
      <li><b>Corriente estimada a 220 V</b>: sobre 45 A es aviso.</li>
      <li><b>Consumo sobre 1.500 kWh</b> en el período es aviso.</li>
      <li>Mismas revisiones de lecturas, totales, duplicados, precio y mora.</li></ul></details>
    <div class="hint" style="margin-top:8px">Son criterios generales de la normativa chilena y no leen tu contrato. Si alguno no calza con tus equipos, dime y lo ajusto.</div></div>`;
  return form + lista + reglas;
}
window.editSumNuevo = () => { editSum = { activo: true, constante: 1 }; render(); };
window.editSumEditar = id => { editSum = { ...sumDe(id) }; render(); };
window.editSumCancel = () => { editSum = null; render(); };
window.guardarSuministro = async function () {
  const v = id => $(id).value.trim(), nombre = v('s-nombre'); if (!nombre) { toast('Falta el nombre', false); return; }
  const d = { nombre, nCliente: v('s-cli'), medidor: v('s-med'), tarifa: v('s-tar'), fase: v('s-fase'), principal: v('s-ppal'), potreros: [...document.querySelectorAll('.s-pot:checked')].map(i => S.potreros[+i.dataset.i].nombre), constante: parseNum($('s-const').value) || 1, centro: v('s-centro'), direccion: v('s-dir'), activo: $('s-act').checked };
  try { if (editSum.id) await updateDoc(doc(db, 'energia_suministros', editSum.id), d); else await addDoc(collection(db, 'energia_suministros'), { ...d, ts: Date.now() }); editSum = null; await cargarTodo(); render(); toast('✓ Suministro guardado'); } catch (e) { toast('Error: ' + e.message, false); }
};
window.borrarSuministro = async function (id) {
  const n = S.fac.filter(f => f.suministro === id).length + S.lec.filter(l => l.suministro === id).length;
  if (!confirm(n ? `Este suministro tiene ${n} facturas/lecturas. Se borrará solo el suministro (las facturas y lecturas quedarán sin asignar). ¿Continuar?` : '¿Borrar este suministro?')) return;
  try { await deleteDoc(doc(db, 'energia_suministros', id)); await cargarTodo(); render(); } catch (e) { toast('Error: ' + e.message, false); }
};

async function iniciar() {
  $('quien').textContent = USER.nombre;
  try { await cargarTodo(); } catch (e) { $('main').innerHTML = `<div class="panel" style="color:#B91C1C">No se pudieron cargar los datos: ${escA(e.message)}<br><span class="hint">Si dice "permission", hay que permitir las colecciones energia_suministros, energia_lecturas y energia_facturas en las reglas de Firestore.</span></div>`; return; }
  render();
}
window.S = S;
revisarAcceso();
</script>
